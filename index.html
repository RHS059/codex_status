<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Status</title>
  <style>
    :root{color-scheme:dark;--bg:#21222c;--panel:#282a36;--panel2:#343746;--ink:#f8f8f2;--muted:#6272a4;--line:#44475a;--deep:#191a21}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;color:var(--ink);overflow:hidden}
    #app{height:100vh;display:flex;flex-direction:column}
    header{height:48px;display:flex;align-items:center;gap:16px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--deep);flex:none}
    .brand{font-size:12px;font-weight:700;letter-spacing:.16em;color:#bd93f9}.summary{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .clock{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted)}.clock b{color:#f8f8f2;letter-spacing:.08em}
    #canvas{position:relative;flex:1;overflow:hidden;background-image:linear-gradient(#282a36 1px,transparent 1px),linear-gradient(90deg,#282a36 1px,transparent 1px),linear-gradient(#2b2d3a 1px,transparent 1px),linear-gradient(90deg,#2b2d3a 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px}
    #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.wire{fill:none;stroke-width:2;stroke-linecap:round;opacity:.82}.wire-glow{fill:none;stroke-width:8;opacity:.055;filter:blur(2px)}
    .spark{fill:#fff;stroke-width:3;filter:drop-shadow(0 0 3px #fff);vector-effect:non-scaling-stroke}
    .port{fill:var(--bg);stroke-width:2}
    .node{position:absolute;width:224px;min-height:142px;border:1px solid var(--line);border-radius:4px;background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:grab;user-select:none;transform:skewX(-8deg);transition:border-color .2s,box-shadow .2s;z-index:2}
    .node:active{cursor:grabbing}.node.active{box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 16px color-mix(in srgb,var(--accent) 24%,transparent)}
    .node-head{height:37px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--deep);background:var(--panel2);border-radius:3px 3px 0 0}.tick{width:4px;height:14px;border-radius:1px;background:var(--accent)}
    .node-title{font-size:13px;font-weight:600;transform:skewX(8deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body{padding:9px 10px 10px;display:flex;flex-direction:column;gap:7px}
    .kind{font-size:10px;letter-spacing:.08em;color:var(--muted);transform:skewX(8deg)}.meter{height:21px;border-radius:2px;background:var(--deep);border:1px solid var(--line);transform:skewX(-6deg);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6);position:relative}
    .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);transition:width .7s ease;box-shadow:inset 0 0 10px rgba(0,0,0,.35)}.shine{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,0) 46%,rgba(0,0,0,.3)),linear-gradient(90deg,rgba(0,0,0,.55) 1px,transparent 1px);background-size:auto,14px 100%}
    .meter-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;transform:skewX(14deg);-webkit-text-stroke:3px var(--deep);paint-order:stroke fill;text-shadow:0 0 6px #000}.eta{position:absolute;right:6px;bottom:3px;font-size:8px;color:#fff;transform:skewX(14deg);opacity:.8;-webkit-text-stroke:2px var(--deep);paint-order:stroke fill}
    .explain{transform:skewX(8deg);padding:8px 10px;border-radius:2px;background:var(--deep);border:1px solid #14151b;box-shadow:inset 0 2px 5px rgba(0,0,0,.55);font-size:10px;line-height:1.35;color:#a8afd0;min-height:42px}
    .error{position:fixed;left:12px;right:12px;bottom:12px;background:#2a1215;color:#ff8a80;border:1px solid #5c2b2e;padding:10px 14px;border-radius:8px;font-size:12px;z-index:99}
    @media(max-width:900px){.summary{display:none}.node{width:200px;transform:scale(.85) skewX(-8deg);transform-origin:top left}}
  </style>
</head>
<body><div id="app"><header><div class="brand">CODEX STATUS</div><div class="summary" id="summary">Loading current activity…</div><div class="clock"><span id="elapsed">+00:00</span><b id="updated">CONNECTING</b></div></header><main id="canvas"><svg id="wires"></svg><div id="nodes"></div></main></div>
<script>
const W=224,H=142;let state=null,positions={},drag=null,lastSignature='';
const canvas=document.getElementById('canvas'),svg=document.getElementById('wires'),nodeLayer=document.getElementById('nodes');
function anchor(id,side){const p=positions[id]||{x:0,y:0};if(side==='top')return{x:p.x+W/2,y:p.y};if(side==='bottom')return{x:p.x+W/2,y:p.y+H};if(side==='left')return{x:p.x,y:p.y+H/2};return{x:p.x+W,y:p.y+H/2}}
function path(a,as,b,bs){if(as==='left'||as==='right'){const d=Math.max(70,Math.abs(b.x-a.x)*.45),s=as==='right'?d:-d,s2=bs==='left'?-d:d;return`M${a.x},${a.y} C${a.x+s},${a.y} ${b.x+s2},${b.y} ${b.x},${b.y}`}const d=Math.max(60,Math.abs(b.y-a.y)*.45),s=as==='bottom'?d:-d,s2=bs==='top'?-d:d;return`M${a.x},${a.y} C${a.x},${a.y+s} ${b.x},${b.y+s2} ${b.x},${b.y}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!state)return;nodeLayer.innerHTML='';for(const n of state.nodes){if(!positions[n.id])positions[n.id]={x:n.x,y:n.y};const el=document.createElement('section');el.className='node '+((n.status||'').toLowerCase()==='queued'||(n.status||'').toLowerCase()==='waiting'?'':'active');el.dataset.id=n.id;el.style.cssText=`left:${positions[n.id].x}px;top:${positions[n.id].y}px;--accent:${n.accent};border-color:${n.accent}`;el.innerHTML=`<div class="node-head"><i class="tick"></i><div class="node-title">${esc(n.title)}</div></div><div class="body"><div class="kind">${esc(n.kind)}</div><div class="meter"><div class="fill" style="width:${Math.max(0,Math.min(100,n.progress))}%"></div><div class="shine"></div><div class="meter-label">${esc(n.status)}</div><div class="eta">${esc(n.eta)}</div></div><div class="explain">${esc(n.explanation)}</div></div>`;el.addEventListener('pointerdown',e=>{drag={id:n.id,dx:e.clientX-positions[n.id].x,dy:e.clientY-48-positions[n.id].y};el.setPointerCapture(e.pointerId)});nodeLayer.appendChild(el)}drawWires()}
function drawWires(){if(!state)return;svg.innerHTML='';state.links.forEach((l,i)=>{const a=anchor(l.a,l.as),b=anchor(l.b,l.bs),d=path(a,l.as,b,l.bs),ns='http://www.w3.org/2000/svg';const glow=document.createElementNS(ns,'path');glow.setAttribute('d',d);glow.setAttribute('stroke',l.color);glow.setAttribute('class','wire-glow');svg.appendChild(glow);const wire=document.createElementNS(ns,'path');wire.setAttribute('id',`wire-${i}`);wire.setAttribute('d',d);wire.setAttribute('stroke',l.color);wire.setAttribute('class','wire');svg.appendChild(wire);for(const p of[a,b]){const port=document.createElementNS(ns,'rect');port.setAttribute('x',p.x-4);port.setAttribute('y',p.y-4);port.setAttribute('width',8);port.setAttribute('height',8);port.setAttribute('rx',1.5);port.setAttribute('stroke',l.color);port.setAttribute('class','port');svg.appendChild(port)}if(l.active){for(let k=0;k<3;k++){const spark=document.createElementNS(ns,'circle');spark.setAttribute('r',2.2);spark.setAttribute('class','spark');spark.setAttribute('stroke',l.color);const motion=document.createElementNS(ns,'animateMotion');motion.setAttribute('dur',`${1.8+k*.35}s`);motion.setAttribute('begin',`${k*.55}s`);motion.setAttribute('repeatCount','indefinite');motion.setAttribute('path',d);spark.appendChild(motion);svg.appendChild(spark)}}})}
window.addEventListener('pointermove',e=>{if(!drag)return;const r=canvas.getBoundingClientRect();positions[drag.id]={x:Math.max(0,Math.min(r.width-W,e.clientX-r.left-drag.dx)),y:Math.max(0,Math.min(r.height-H,e.clientY-r.top-drag.dy+48))};const el=document.querySelector(`[data-id="${drag.id}"]`);if(el){el.style.left=positions[drag.id].x+'px';el.style.top=positions[drag.id].y+'px'}drawWires()});window.addEventListener('pointerup',()=>drag=null);
async function refresh(){try{const res=await fetch(`status.json?t=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw new Error(`status ${res.status}`);const data=await res.json(),sig=JSON.stringify(data);if(sig!==lastSignature){const known=new Set(data.nodes.map(n=>n.id));Object.keys(positions).forEach(id=>{if(!known.has(id))delete positions[id]});state=data;lastSignature=sig;document.getElementById('summary').textContent=data.summary;document.getElementById('elapsed').textContent=data.elapsed;document.getElementById('updated').textContent='LIVE · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});render()}}catch(err){document.getElementById('updated').textContent='OFFLINE';if(!document.querySelector('.error')){const e=document.createElement('div');e.className='error';e.textContent='Status feed unavailable. Start the included local server, then reload.';document.body.appendChild(e)}}}
refresh();setInterval(refresh,1000);window.addEventListener('resize',drawWires);
</script></body></html>
