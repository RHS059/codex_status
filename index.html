<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex Status</title>
<style>
:root{color-scheme:dark;--bg:#21222c;--panel:#282a36;--panel2:#343746;--ink:#f8f8f2;--muted:#6272a4;--line:#44475a;--deep:#191a21}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;color:var(--ink);overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}header{height:48px;display:flex;align-items:center;gap:16px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--deep);flex:none;z-index:20}
.brand{font-size:12px;font-weight:700;letter-spacing:.16em;color:#bd93f9}.summary{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clock{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted)}.clock b{color:var(--ink);letter-spacing:.08em}
.controls{display:flex;align-items:center;gap:4px}.controls button{height:26px;min-width:28px;padding:0 7px;border:1px solid var(--line);border-radius:3px;background:var(--deep);color:var(--ink);font:700 11px/1 inherit;cursor:pointer}.controls button:hover{border-color:#8be9fd;color:#8be9fd}.zoom-readout{width:54px;text-align:center;font-size:10px;color:var(--muted)}
#canvas{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:linear-gradient(#282a36 1px,transparent 1px),linear-gradient(90deg,#282a36 1px,transparent 1px),linear-gradient(#2b2d3a 1px,transparent 1px),linear-gradient(90deg,#2b2d3a 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px}#canvas.panning{cursor:grabbing}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.wire{fill:none;stroke-width:2;stroke-linecap:round;opacity:.82}.wire-glow{fill:none;stroke-width:8;opacity:.055;filter:blur(2px)}.spark{fill:#fff;stroke-width:3;filter:drop-shadow(0 0 3px #fff);vector-effect:non-scaling-stroke}.port{fill:var(--bg);stroke-width:2}
.node{position:absolute;left:0;top:0;width:224px;min-height:142px;border:1px solid var(--line);border-radius:4px;background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:grab;user-select:none;transform-origin:0 0;will-change:transform;z-index:2}.node:active{cursor:grabbing}.node.active{box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 16px color-mix(in srgb,var(--accent) 24%,transparent)}
.node::after{content:"";position:absolute;inset:-2px;border:2px solid transparent;border-radius:6px;pointer-events:none}.node.changed::after{animation:card-shine 1.25s cubic-bezier(.16,1,.3,1)}
@keyframes card-shine{0%{border-color:transparent;box-shadow:0 0 0 transparent}18%{border-color:#fff;box-shadow:0 0 6px #fff,0 0 20px var(--accent)}55%{border-color:var(--accent);box-shadow:0 0 12px var(--accent)}100%{border-color:transparent;box-shadow:0 0 0 transparent}}
.node-head{height:37px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--deep);background:var(--panel2);border-radius:3px 3px 0 0}.tick{width:4px;height:14px;border-radius:1px;background:var(--accent)}.node-title{font-size:13px;font-weight:600;transform:skewX(8deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body{padding:9px 10px 10px;display:flex;flex-direction:column;gap:7px}.kind{font-size:10px;letter-spacing:.08em;color:var(--muted);transform:skewX(8deg)}
.meter{height:21px;border-radius:2px;background:var(--deep);border:1px solid var(--line);transform:skewX(-6deg);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6);position:relative}.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);transition:width 1s cubic-bezier(.18,.84,.2,1);box-shadow:inset 0 0 10px rgba(0,0,0,.35)}.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 0 35%,rgba(255,255,255,.85) 48%,transparent 61%);transform:translateX(-140%)}.meter.surge .fill::after{animation:bar-sweep .72s ease-out 2}.meter.drain .fill{filter:saturate(.55);animation:bar-drain .75s ease}.meter.surge{animation:meter-impact .72s ease-out}.shine{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,0) 46%,rgba(0,0,0,.3)),linear-gradient(90deg,rgba(0,0,0,.55) 1px,transparent 1px);background-size:auto,14px 100%}.meter-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;transform:skewX(14deg);-webkit-text-stroke:3px var(--deep);paint-order:stroke fill;text-shadow:0 0 6px #000}.eta{position:absolute;right:6px;bottom:3px;font-size:8px;color:#fff;transform:skewX(14deg);opacity:.8;-webkit-text-stroke:2px var(--deep);paint-order:stroke fill}
@keyframes bar-sweep{to{transform:translateX(150%)}}@keyframes meter-impact{0%,100%{box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}28%{box-shadow:0 0 4px #fff,0 0 16px var(--accent),inset 0 0 0 1px #fff}}@keyframes bar-drain{0%,100%{opacity:1}35%{opacity:.52}55%{opacity:1}}
.explain{transform:skewX(8deg);padding:8px 10px;border-radius:2px;background:var(--deep);border:1px solid #14151b;box-shadow:inset 0 2px 5px rgba(0,0,0,.55);font-size:10px;line-height:1.35;color:#a8afd0;min-height:42px}.crossfade{transition:opacity .18s ease,filter .18s ease}.crossfade.fade-out{opacity:0;filter:blur(2px)}
.hint{position:absolute;left:14px;bottom:12px;padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:rgba(25,26,33,.82);color:var(--muted);font-size:9px;letter-spacing:.04em;pointer-events:none;z-index:10}.error{position:fixed;left:12px;right:12px;bottom:12px;background:#2a1215;color:#ff8a80;border:1px solid #5c2b2e;padding:10px 14px;border-radius:8px;font-size:12px;z-index:99}
@media(max-width:900px){.summary,.hint{display:none}.clock{gap:6px}.controls button{min-width:24px;padding:0 5px}}@media(prefers-reduced-motion:reduce){.node.changed::after,.meter.surge,.meter.surge .fill::after,.meter.drain .fill{animation:none}.fill,.crossfade{transition-duration:.01ms}}
</style>
</head>
<body><div id="app"><header><div class="brand">CODEX STATUS</div><div class="summary" id="summary">Loading current activity…</div><div class="clock"><span id="elapsed">+00:00</span><b id="updated">CONNECTING</b></div><div class="controls"><button id="zoom-out" title="Zoom out">−</button><span class="zoom-readout" id="zoom-readout">100%</span><button id="zoom-in" title="Zoom in">+</button><button id="reset" title="Reset view">↺</button></div></header><main id="canvas"><svg id="wires"></svg><div id="nodes"></div><div class="hint">DRAG GRID · PAN &nbsp; WHEEL · PAN &nbsp; CTRL + WHEEL · ZOOM &nbsp; DRAG CARD · MOVE</div></main></div>
<script>
const W=224,H=142;let state=null,positions={},nodeData={},nodeDrag=null,panDrag=null;const camera={x:0,y:0,z:1};
const canvas=document.getElementById('canvas'),svg=document.getElementById('wires'),nodeLayer=document.getElementById('nodes'),zoomReadout=document.getElementById('zoom-readout');
function screenPoint(x,y){return{x:camera.x+x*camera.z,y:camera.y+y*camera.z}}function worldPoint(x,y){return{x:(x-camera.x)/camera.z,y:(y-camera.y)/camera.z}}
function anchor(id,side){const p=positions[id]||{x:0,y:0};let x=p.x,y=p.y;if(side==='top')x+=W/2;else if(side==='bottom'){x+=W/2;y+=H}else if(side==='left')y+=H/2;else{x+=W;y+=H/2}return screenPoint(x,y)}
function path(a,as,b,bs){if(as==='left'||as==='right'){const d=Math.max(70,Math.abs(b.x-a.x)*.45),s=as==='right'?d:-d,s2=bs==='left'?-d:d;return`M${a.x},${a.y} C${a.x+s},${a.y} ${b.x+s2},${b.y} ${b.x},${b.y}`}const d=Math.max(60,Math.abs(b.y-a.y)*.45),s=as==='bottom'?d:-d,s2=bs==='top'?-d:d;return`M${a.x},${a.y} C${a.x},${a.y+s} ${b.x},${b.y+s2} ${b.x},${b.y}`}
function nodeTransform(id){const p=screenPoint(positions[id].x,positions[id].y);return`translate3d(${p.x}px,${p.y}px,0) scale(${camera.z}) skewX(-8deg)`}
function createNode(n){positions[n.id]??={x:n.x,y:n.y};const el=document.createElement('section');el.className='node';el.dataset.id=n.id;el.innerHTML='<div class="node-head"><i class="tick"></i><div class="node-title crossfade"></div></div><div class="body"><div class="kind crossfade"></div><div class="meter"><div class="fill"></div><div class="shine"></div><div class="meter-label crossfade"></div><div class="eta crossfade"></div></div><div class="explain crossfade"></div></div>';el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.stopPropagation();const r=canvas.getBoundingClientRect(),w=worldPoint(e.clientX-r.left,e.clientY-r.top);nodeDrag={id:n.id,dx:w.x-positions[n.id].x,dy:w.y-positions[n.id].y};el.setPointerCapture(e.pointerId)});nodeLayer.appendChild(el);return el}
function setTextAfterFade(el,n){const fields=[['.node-title',n.title],['.kind',n.kind],['.meter-label',n.status],['.eta',n.eta],['.explain',n.explanation]],parts=fields.map(([q])=>el.querySelector(q));parts.forEach(p=>p.classList.add('fade-out'));setTimeout(()=>{fields.forEach(([q,v])=>el.querySelector(q).textContent=v??'');requestAnimationFrame(()=>parts.forEach(p=>p.classList.remove('fade-out')))},180)}
function pulseCard(el){el.classList.remove('changed');void el.offsetWidth;el.classList.add('changed');setTimeout(()=>el.classList.remove('changed'),1300)}
function updateNode(n,old,initial=false){let el=nodeLayer.querySelector(`[data-id="${CSS.escape(n.id)}"]`);if(!el)el=createNode(n);el.style.setProperty('--accent',n.accent);el.style.borderColor=n.accent;el.classList.toggle('active',!['queued','waiting','complete','idle','ready'].includes(String(n.status).toLowerCase()));el.style.transform=nodeTransform(n.id);const changed=!old||['title','kind','status','eta','explanation'].some(k=>old[k]!==n[k]);if(initial||!old){el.querySelector('.node-title').textContent=n.title;el.querySelector('.kind').textContent=n.kind;el.querySelector('.meter-label').textContent=n.status;el.querySelector('.eta').textContent=n.eta;el.querySelector('.explain').textContent=n.explanation}else if(changed)setTextAfterFade(el,n);const meter=el.querySelector('.meter'),fill=el.querySelector('.fill'),before=old?.progress??0,after=Math.max(0,Math.min(100,Number(n.progress)||0));if(initial||!old)fill.style.width=after+'%';else if(before!==after){meter.classList.remove('surge','drain');void meter.offsetWidth;meter.classList.add(after>before?'surge':'drain');requestAnimationFrame(()=>fill.style.width=after+'%');setTimeout(()=>meter.classList.remove('surge','drain'),1500)}if(old&&(changed||before!==after||old.accent!==n.accent))pulseCard(el)}
function reconcile(data){const first=!state,old=nodeData;state=data;const ids=new Set(data.nodes.map(n=>n.id));nodeLayer.querySelectorAll('.node').forEach(el=>{if(!ids.has(el.dataset.id))el.remove()});for(const n of data.nodes)updateNode(n,old[n.id],first);nodeData=Object.fromEntries(data.nodes.map(n=>[n.id,n]));document.getElementById('summary').textContent=data.summary;document.getElementById('elapsed').textContent=data.elapsed;updateGrid()}
function drawWires(){if(!state)return;svg.innerHTML='';state.links.forEach(l=>{if(!positions[l.a]||!positions[l.b])return;const a=anchor(l.a,l.as),b=anchor(l.b,l.bs),d=path(a,l.as,b,l.bs),ns='http://www.w3.org/2000/svg';for(const klass of['wire-glow','wire']){const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('stroke',l.color);p.setAttribute('class',klass);svg.appendChild(p)}for(const p of[a,b]){const port=document.createElementNS(ns,'rect');port.setAttribute('x',p.x-4);port.setAttribute('y',p.y-4);port.setAttribute('width',8);port.setAttribute('height',8);port.setAttribute('rx',1.5);port.setAttribute('stroke',l.color);port.setAttribute('class','port');svg.appendChild(port)}if(l.active)for(let k=0;k<3;k++){const spark=document.createElementNS(ns,'circle');spark.setAttribute('r',2.2);spark.setAttribute('class','spark');spark.setAttribute('stroke',l.color);const motion=document.createElementNS(ns,'animateMotion');motion.setAttribute('dur',`${1.8+k*.35}s`);motion.setAttribute('begin',`${k*.55}s`);motion.setAttribute('repeatCount','indefinite');motion.setAttribute('path',d);spark.appendChild(motion);svg.appendChild(spark)}})}
function updateGrid(){const major=120*camera.z,minor=24*camera.z,pos=`${camera.x}px ${camera.y}px`;canvas.style.backgroundSize=`${major}px ${major}px,${major}px ${major}px,${minor}px ${minor}px,${minor}px ${minor}px`;canvas.style.backgroundPosition=`${pos},${pos},${pos},${pos}`;zoomReadout.textContent=camera.z>=.01?Math.round(camera.z*100)+'%':camera.z.toExponential(1);nodeLayer.querySelectorAll('.node').forEach(el=>{if(positions[el.dataset.id])el.style.transform=nodeTransform(el.dataset.id)});drawWires()}
function zoomAt(factor,x,y){const next=camera.z*factor;if(!Number.isFinite(next)||next<=0)return;const wx=(x-camera.x)/camera.z,wy=(y-camera.y)/camera.z;camera.z=next;camera.x=x-wx*next;camera.y=y-wy*next;updateGrid()}
canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.node')||e.button>1)return;const r=canvas.getBoundingClientRect();panDrag={dx:e.clientX-r.left-camera.x,dy:e.clientY-r.top-camera.y};canvas.classList.add('panning');canvas.setPointerCapture(e.pointerId)});
window.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();if(nodeDrag){const w=worldPoint(e.clientX-r.left,e.clientY-r.top);positions[nodeDrag.id]={x:w.x-nodeDrag.dx,y:w.y-nodeDrag.dy};const el=nodeLayer.querySelector(`[data-id="${CSS.escape(nodeDrag.id)}"]`);if(el)el.style.transform=nodeTransform(nodeDrag.id);drawWires()}else if(panDrag){camera.x=e.clientX-r.left-panDrag.dx;camera.y=e.clientY-r.top-panDrag.dy;updateGrid()}});
window.addEventListener('pointerup',()=>{nodeDrag=null;panDrag=null;canvas.classList.remove('panning')});
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(e.ctrlKey||e.metaKey)zoomAt(Math.exp(-e.deltaY*.002),x,y);else{camera.x-=e.deltaX;camera.y-=e.deltaY;updateGrid()}},{passive:false});
document.getElementById('zoom-in').onclick=()=>zoomAt(1.25,canvas.clientWidth/2,canvas.clientHeight/2);document.getElementById('zoom-out').onclick=()=>zoomAt(.8,canvas.clientWidth/2,canvas.clientHeight/2);document.getElementById('reset').onclick=()=>{camera.x=0;camera.y=0;camera.z=1;if(state)for(const n of state.nodes)positions[n.id]={x:n.x,y:n.y};updateGrid()};
window.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')zoomAt(1.25,canvas.clientWidth/2,canvas.clientHeight/2);else if(e.key==='-')zoomAt(.8,canvas.clientWidth/2,canvas.clientHeight/2);else if(e.key==='0')document.getElementById('reset').click()});window.addEventListener('resize',updateGrid);
async function refresh(){try{const res=await fetch(`status.json?t=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw Error(res.status);const data=await res.json();if(!state||JSON.stringify(data)!==JSON.stringify(state))reconcile(data);document.getElementById('updated').textContent='LIVE · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});document.querySelector('.error')?.remove()}catch(err){document.getElementById('updated').textContent='OFFLINE';if(!document.querySelector('.error')){const e=document.createElement('div');e.className='error';e.textContent='Status feed unavailable. Retrying automatically…';document.body.appendChild(e)}}}
refresh();setInterval(refresh,1000);
</script></body></html>
